<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f4f6f1">
	<title>모아 | 나만의 가계부</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root{font-family:"DM Sans","Noto Sans KR",sans-serif;color:#202720;background:#f4f6f1;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#202720;--muted:#7b847a;--line:#e4e9e1;--green:#245c47;--green-soft:#e5f0e9;--orange:#e7784b;--red:#c9574e;--paper:#fff;--radius:10px}
		*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(ellipse at 2% 0%,rgba(211,229,210,.48),transparent 33%),#f4f6f1}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #97c5a6;outline-offset:2px}.shell{max-width:1220px;margin:auto;padding:0 36px 64px}.topbar{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(32,39,32,.1)}.brand{display:flex;align-items:center;gap:11px;font-size:19px;font-weight:800;letter-spacing:0}.brand-mark{width:30px;height:30px;background:var(--green);border-radius:9px;display:grid;place-items:center;color:#fff;font-size:16px}.top-meta{display:flex;align-items:center;gap:18px;color:var(--muted);font-size:12px}.date-now{font-variant-numeric:tabular-nums}.privacy{display:flex;align-items:center;gap:7px}.privacy i{width:7px;height:7px;border-radius:50%;background:#79a987}.nav{display:flex;gap:27px;border-bottom:1px solid var(--line);margin-bottom:31px}.nav button{padding:16px 2px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:#7a8279;font-size:13px;font-weight:600}.nav button.active{border-bottom-color:var(--green);color:var(--green)}.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin:0 0 20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:0;color:#829080}.page-head h1{font-size:23px;margin:6px 0 0;font-weight:700}.subtle{font-size:12px;color:var(--muted)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}.overview-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:15px}.net-worth{min-height:210px;padding:24px 27px;background:var(--green);color:white;position:relative;overflow:hidden;border:0}.net-worth:after{content:"";position:absolute;right:-42px;top:-112px;width:280px;height:280px;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.035),0 0 0 58px rgba(255,255,255,.025)}.net-worth .label{font-size:12px;color:#c6d9cd}.net-worth strong{display:block;font-size:36px;font-weight:600;letter-spacing:0;margin:20px 0 18px;font-variant-numeric:tabular-nums}.worth-foot{display:flex;gap:20px;font-size:11px;color:#cfdfd5}.worth-foot b{font-weight:600;color:#fff;margin-left:5px}.asset-snapshot{padding:22px 23px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.panel-title h2{margin:0;font-size:14px;font-weight:700}.text-button{background:none;border:0;color:var(--green);font-size:11px;font-weight:700;padding:4px}.asset-line{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid #eef0ec;font-size:12px}.asset-line .name{display:flex;align-items:center;gap:9px}.dot{width:8px;height:8px;border-radius:50%;background:#88b08d}.dot.cash{background:#e8a56b}.asset-line strong{font-variant-numeric:tabular-nums}.quick-entry{margin-top:15px;padding:21px 23px}.quick-entry h2{font-size:14px;margin:0}.quick-intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.quick-intro p{font-size:11px;color:var(--muted);margin:0}.entry-form{display:grid;grid-template-columns:132px minmax(160px,1fr) 175px 105px;gap:9px}.segmented{height:42px;padding:3px;display:flex;background:#f0f3ef;border-radius:7px}.segmented button{flex:1;background:transparent;border:0;border-radius:5px;font-size:12px;color:#7d857d;font-weight:600}.segmented button.active[data-kind="expense"]{background:#fff;color:var(--red);box-shadow:0 1px 3px #20272012}.segmented button.active[data-kind="income"]{background:#fff;color:var(--green);box-shadow:0 1px 3px #20272012}.field{width:100%;height:42px;border:1px solid var(--line);border-radius:7px;padding:0 12px;color:var(--ink);background:#fff;font-size:12px}.field::placeholder{color:#a0a79f}.amount-wrap{position:relative}.amount-wrap input{padding-right:35px}.amount-wrap span{position:absolute;right:13px;top:14px;font-size:11px;color:#8d958c}.primary{border:0;border-radius:7px;background:var(--green);color:white;font-size:12px;font-weight:700;padding:0 14px}.primary:hover{background:#1b4c39}.hint-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;color:#929a91;font-size:10px}.auto-tag{color:var(--green);background:var(--green-soft);padding:4px 8px;border-radius:20px}.lower-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.lower-panel{padding:20px 22px;min-height:200px}.empty{color:#929a91;font-size:12px;line-height:1.8;text-align:center;padding:35px 8px}.transaction-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:12px 0;border-top:1px solid #eef0ec;font-size:12px}.transaction-row:first-of-type{border-top:0}.transaction-title{font-weight:600}.transaction-meta{display:flex;gap:8px;align-items:center;margin-top:4px;color:#8d958c;font-size:10px}.category-pill{border-radius:4px;padding:3px 6px;font-size:10px;background:#eff3ed;color:#54735b}.positive{color:var(--green)}.negative{color:var(--red)}.section-wrap{padding:22px 24px}.toolbar{display:flex;align-items:center;gap:9px}.small-select,.month-input{height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 10px;font-size:11px;color:var(--ink)}.ledger-list .transaction-row{padding:15px 3px}.delete-btn{border:0;background:transparent;color:#a0a79f;font-size:15px;padding:5px}.delete-btn:hover{color:var(--red)}.month-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat-box{padding:17px 18px}.stat-box span{color:var(--muted);font-size:11px}.stat-box strong{display:block;font-size:19px;margin-top:9px;font-weight:600;font-variant-numeric:tabular-nums}.report-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:15px}.report-panel{padding:21px 23px;min-height:250px}.bar-row{display:grid;grid-template-columns:88px 1fr 90px;gap:10px;align-items:center;margin:15px 0;font-size:11px}.bar-track{height:8px;background:#f0f2ef;border-radius:8px;overflow:hidden}.bar-fill{height:100%;border-radius:8px;background:#75a581;min-width:2px}.bar-value{text-align:right;font-variant-numeric:tabular-nums;color:#5e685e}.asset-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:9px;margin:14px 0}.cash-form{display:flex;gap:9px;margin:15px 0 20px}.cash-form .field{max-width:220px}.asset-table{width:100%;border-collapse:collapse;font-size:11px}.asset-table th{text-align:left;color:#899188;font-weight:500;padding:10px 6px;border-bottom:1px solid var(--line)}.asset-table td{padding:13px 6px;border-bottom:1px solid #eef0ec;font-variant-numeric:tabular-nums}.asset-table th:not(:first-child),.asset-table td:not(:first-child){text-align:right}.connection-note{padding:12px 14px;border-radius:7px;background:#f3f6f0;color:#647263;font-size:11px;line-height:1.7;margin-top:14px}.status-line{font-size:10px;color:#788378}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,15px);background:#202720;color:white;padding:11px 17px;border-radius:7px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}
		@media(max-width:760px){.shell{padding:0 17px 40px}.topbar{height:67px}.top-meta{gap:10px;font-size:10px}.privacy{display:none}.nav{gap:22px;overflow:auto;margin-bottom:24px}.nav button{white-space:nowrap}.overview-grid,.lower-grid,.report-grid{grid-template-columns:1fr}.net-worth{min-height:190px}.net-worth strong{font-size:30px}.entry-form{grid-template-columns:120px 1fr}.entry-form .primary{height:42px}.entry-form .amount-wrap{grid-column:1}.entry-form .field.description{grid-column:2}.entry-form .primary{grid-column:1 / -1}.quick-intro{align-items:flex-start;gap:6px;flex-direction:column}.asset-form{grid-template-columns:1fr 1fr}.asset-form .primary{height:40px}.month-stats{gap:7px}.stat-box{padding:13px 11px}.stat-box strong{font-size:14px}.section-wrap{padding:17px 14px}.bar-row{grid-template-columns:75px 1fr 78px}.asset-table{font-size:10px}.asset-table th,.asset-table td{padding:10px 3px}.page-head h1{font-size:20px}}
		@media(max-width:390px){.shell{padding-left:12px;padding-right:12px}.entry-form{grid-template-columns:105px 1fr}.asset-snapshot{padding:18px}.top-meta .date-now{display:none}}
	</style>
</head>
<body>
	<div class="shell">
		<header class="topbar">
			<div class="brand"><span class="brand-mark">m</span>모아</div>
			<div class="top-meta"><span class="privacy"><i></i> 내 기기에만 저장</span><span class="date-now" id="today"></span></div>
		</header>
		<nav class="nav" aria-label="주요 메뉴">
			<button class="active" data-view="home">한눈에</button>
			<button data-view="ledger">가계부</button>
			<button data-view="report">이번 달</button>
			<button data-view="assets">자산 관리</button>
		</nav>
		<main id="app"></main>
	</div>
	<div class="toast" id="toast" role="status"></div>
	<script>
		const STORAGE_KEY = "moa-household-v1";
		const colors = ["#78a77e", "#e29a62", "#d77b6c", "#7d9bb4", "#bb8dba", "#d1b75f", "#69aaa3", "#a3a77a"];
		const categoryRules = [
			["반려동물", /토카|강아지|사료|애견|반려동물|펫용품/], ["식자재", /식자재|장보기|마트|쌀|식재료|장본|과일|채소/],
			["식비·외식", /식비|외식|식당|배달|점심|저녁|커피|카페|간식|음식/], ["쿠팡", /쿠팡|로켓배송/],
			["용돈", /아내.*용돈|남편.*용돈|용돈/], ["생활비", /생활비|관리비|생필품/], ["의류·뷰티", /옷|의류|뷰티|화장품|미용실|스킨케어/],
			["건강·의료", /건강|병원|약국|의료|검진/], ["임신·출산", /임신|출산|산후|육아/], ["경조사·선물", /경조사|축의|조의|생일선물|선물/],
			["영업·세금", /영업비용|세금|부가세|종합소득세/], ["보험", /건강\s*보험|연금\s*보험|개인\s*보험|보험료/], ["통신", /휴대폰|통신비|인터넷요금/],
			["업무", /편집자|광고비|업무|외주비/], ["주거", /전세\s*이자|대출\s*이자|월세|전세/], ["구독·AI", /구독|넷플릭스|유튜브|ai|openai|chatgpt/i],
			["리스·차량", /리스|자동차|주유|주차|차량/], ["미용", /두발|헤어|이발/], ["저축·투자", /청약|저축|적금|투자/]
		];
		const incomeRules = [
			["급여", /월급|급여|상여|보너스/], ["사업 소득", /매출|정산|사업소득|프리랜서/],
			["이자·배당", /이자|배당/], ["환급·기타소득", /환급|캐시백|중고판매|용돈받/]
		];
		const defaultState = { cash: 0, holdings: [], transactions: [], pricesUpdated: null };
		let state = loadState();
		let activeView = "home";
		let entryKind = "expense";
		let selectedMonth = dateKey().slice(0, 7);

		function loadState() {
			try { return { ...defaultState, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") }; }
			catch { return { ...defaultState }; }
		}
		function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
		function dateKey(date = new Date()) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`; }
		function won(value) { return `${Math.round(Number(value) || 0).toLocaleString("ko-KR")}원`; }
		function safe(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[char])); }
		function todayText() { return new Intl.DateTimeFormat("ko-KR", { year:"numeric", month:"long", day:"numeric", weekday:"short" }).format(new Date()); }
		function monthTransactions(month = selectedMonth) { return state.transactions.filter(item => item.date.startsWith(month)); }
		function totalAssets() { return state.cash + state.holdings.reduce((sum, item) => sum + item.quantity * (item.price || item.average), 0); }
		function classify(title, kind = "expense") {
			if (kind === "income") return incomeRules.find(([, pattern]) => pattern.test(title))?.[0] || "기타 소득";
			return categoryRules.find(([, pattern]) => pattern.test(title))?.[0] || "기타";
		}
		function categoryColor(category) { return colors[[...categoryRules.map(([name]) => name), "기타"].indexOf(category) % colors.length] || colors[0]; }
		function summarize(items) {
			return items.reduce((result, item) => { result[item.kind] += item.amount; return result; }, { income: 0, expense: 0 });
		}
		function render() {
			document.getElementById("today").textContent = todayText();
			document.querySelectorAll(".nav button").forEach(button => button.classList.toggle("active", button.dataset.view === activeView));
			const app = document.getElementById("app");
			if (activeView === "home") app.innerHTML = renderHome();
			if (activeView === "ledger") app.innerHTML = renderLedger();
			if (activeView === "report") app.innerHTML = renderReport();
			if (activeView === "assets") app.innerHTML = renderAssets();
		}
		function renderHead(kicker, title, right = "") {
			return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1></div>${right}</div>`;
		}
		function renderHome() {
			const current = monthTransactions();
			const totals = summarize(current);
			const recent = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date)).slice(0, 4);
			const coinValue = state.holdings.reduce((sum, item) => sum + item.quantity * (item.price || item.average), 0);
			return `${renderHead("YOUR MONEY, IN ONE PLACE", "오늘의 자산")}
				<div class="overview-grid">
					<section class="panel net-worth"><div class="label">나의 총 자산</div><strong>${won(totalAssets())}</strong><div class="worth-foot"><span>현금·예금 <b>${won(state.cash)}</b></span><span>투자 자산 <b>${won(coinValue)}</b></span></div></section>
					<section class="panel asset-snapshot"><div class="panel-title"><h2>자산 요약</h2><button class="text-button" data-goto="assets">자산 관리 →</button></div>
						<div class="asset-line"><span class="name"><i class="dot cash"></i>현금·예금</span><strong>${won(state.cash)}</strong></div>
						${state.holdings.length ? state.holdings.slice(0,3).map(item => `<div class="asset-line"><span class="name"><i class="dot"></i>${safe(item.symbol)}</span><strong>${won(item.quantity * (item.price || item.average))}</strong></div>`).join("") : `<div class="asset-line"><span class="name"><i class="dot"></i>투자 자산</span><strong>보유 자산을 추가해 주세요</strong></div>`}
					</section>
				</div>
				<section class="panel quick-entry"><div class="quick-intro"><h2>내역 빠르게 추가</h2><p>내용만 적으면 알맞은 카테고리로 자동 분류해요.</p></div>
					<form id="transaction-form" class="entry-form">
						<div class="segmented"><button type="button" class="active" data-kind="expense">지출</button><button type="button" data-kind="income">소득</button></div>
						<input class="field description" name="title" placeholder="예: 쿠팡 강아지 사료, 편집자 비용" required maxlength="80">
						<div class="amount-wrap"><input class="field" name="amount" type="number" min="1" step="1" placeholder="금액" required><span>원</span></div>
						<button class="primary" type="submit">내역 추가</button>
					</form>
					<div class="hint-row"><span>입력한 내역은 이 기기에만 저장됩니다.</span><span class="auto-tag">자동 분류</span></div>
				</section>
				<div class="lower-grid">
					<section class="panel lower-panel"><div class="panel-title"><h2>이번 달 흐름</h2><button class="text-button" data-goto="report">자세히 보기 →</button></div>
						${totals.income || totals.expense ? `<div class="asset-line"><span>들어온 돈</span><strong class="positive">+${won(totals.income)}</strong></div><div class="asset-line"><span>나간 돈</span><strong class="negative">−${won(totals.expense)}</strong></div><div class="asset-line"><span>이번 달 잔액</span><strong>${won(totals.income - totals.expense)}</strong></div>` : `<div class="empty">이번 달 내역이 아직 없어요.<br>첫 내역을 추가하면 소비 흐름을 보여드릴게요.</div>`}
					</section>
					<section class="panel lower-panel"><div class="panel-title"><h2>최근 내역</h2><button class="text-button" data-goto="ledger">전체 보기 →</button></div>${recent.length ? recent.map(renderTransaction).join("") : `<div class="empty">아직 기록된 내역이 없어요.</div>`}</section>
				</div>`;
		}
		function renderTransaction(item, showDelete = false) {
			const positive = item.kind === "income";
			return `<div class="transaction-row"><div><div class="transaction-title">${safe(item.title)}</div><div class="transaction-meta"><span>${safe(item.date)}</span><span class="category-pill">${safe(item.category)}</span></div></div><div style="display:flex;align-items:center;gap:8px"><strong class="${positive ? "positive" : "negative"}">${positive ? "+" : "−"}${won(item.amount)}</strong>${showDelete ? `<button class="delete-btn" data-delete="${safe(item.id)}" aria-label="내역 삭제">×</button>` : ""}</div></div>`;
		}
		function renderLedger() {
			const items = [...monthTransactions()].sort((a,b) => b.date.localeCompare(a.date));
			const totals = summarize(items);
			return `${renderHead("MONEY JOURNAL", "가계부", `<input class="month-input" id="ledger-month" type="month" value="${safe(selectedMonth)}">`)}
				<section class="panel section-wrap ledger-list">${items.length ? items.map(item => renderTransaction(item, true)).join("") : `<div class="empty">이 달에는 기록된 내역이 없어요.</div>`}</section>
				<p class="subtle" style="text-align:right;margin:12px 2px">소득 ${won(totals.income)} · 지출 ${won(totals.expense)}</p>`;
		}
		function renderReport() {
			const items = monthTransactions();
			const totals = summarize(items);
			const expenses = items.filter(item => item.kind === "expense").reduce((groups, item) => { groups[item.category] = (groups[item.category] || 0) + item.amount; return groups; }, {});
			const categories = Object.entries(expenses).sort((a,b) => b[1] - a[1]);
			const max = categories[0]?.[1] || 1;
			return `${renderHead("MONTHLY REVIEW", "이번 달 소비", `<input class="month-input" id="report-month" type="month" value="${safe(selectedMonth)}">`)}
				<div class="month-stats"><section class="panel stat-box"><span>이번 달 소득</span><strong class="positive">${won(totals.income)}</strong></section><section class="panel stat-box"><span>이번 달 지출</span><strong class="negative">${won(totals.expense)}</strong></section><section class="panel stat-box"><span>남은 금액</span><strong>${won(totals.income - totals.expense)}</strong></section></div>
				<div class="report-grid"><section class="panel report-panel"><div class="panel-title"><h2>카테고리별 지출</h2><span class="subtle">${categories.length}개 카테고리</span></div>${categories.length ? categories.map(([category, amount]) => `<div class="bar-row"><span>${safe(category)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.max(3, amount / max * 100)}%;background:${categoryColor(category)}"></div></div><span class="bar-value">${won(amount)}</span></div>`).join("") : `<div class="empty">내역을 추가하면 카테고리별 지출을 분석해요.</div>`}</section>
					<section class="panel report-panel"><div class="panel-title"><h2>이번 달 기록</h2></div>${items.length ? `<div class="asset-line"><span>총 기록</span><strong>${items.length}건</strong></div><div class="asset-line"><span>가장 많이 쓴 곳</span><strong>${categories[0] ? safe(categories[0][0]) : "없음"}</strong></div><div class="asset-line"><span>소득 대비 지출</span><strong>${totals.income ? Math.round(totals.expense / totals.income * 100) + "%" : "소득 기록 없음"}</strong></div><div class="connection-note">소비 내역은 입력한 내용을 기준으로 자동 분류됩니다. 분류가 맞지 않으면 제목을 더 구체적으로 적어 주세요.</div>` : `<div class="empty">아직 분석할 내역이 없어요.</div>`}</section></div>`;
		}
		function renderAssets() {
			const rows = state.holdings.map(item => `<tr><td><strong>${safe(item.symbol)}</strong><div class="status-line">${safe(item.market)}</div></td><td>${Number(item.quantity).toLocaleString("ko-KR", { maximumFractionDigits: 8 })}</td><td>${won(item.average)}</td><td>${item.price ? won(item.price) : "조회 전"}</td><td><strong>${won(item.quantity * (item.price || item.average))}</strong></td><td><button class="delete-btn" data-asset-delete="${safe(item.id)}" aria-label="자산 삭제">×</button></td></tr>`).join("");
			const updated = state.pricesUpdated ? `마지막 시세 확인 ${new Date(state.pricesUpdated).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit" })}` : "시세를 연결해 주세요";
			return `${renderHead("ASSET TRACKER", "자산 관리", `<button class="primary" id="refresh-prices" style="height:36px">업비트 시세 새로고침</button>`)}
				<section class="panel section-wrap"><div class="panel-title"><h2>현금·예금</h2><span class="status-line">총 자산에 포함됩니다</span></div><form id="cash-form" class="cash-form"><div class="amount-wrap"><input class="field" name="cash" type="number" min="0" step="1" value="${state.cash}" aria-label="현금과 예금 금액"><span>원</span></div><button class="primary" type="submit" style="height:42px">금액 저장</button></form></section>
				<section class="panel section-wrap" style="margin-top:15px"><div class="panel-title"><h2>코인 보유 내역</h2><span class="status-line" id="price-status">${updated}</span></div>
					<form id="asset-form" class="asset-form"><input class="field" name="symbol" placeholder="코인 심볼 (예: BTC)" maxlength="12" required><input class="field" name="quantity" type="number" min="0.00000001" step="any" placeholder="보유 수량" required><input class="field" name="average" type="number" min="0" step="any" placeholder="평균 매수가 (원)" required><button class="primary" type="submit">보유 추가</button></form>
					<div style="overflow-x:auto"><table class="asset-table"><thead><tr><th>자산</th><th>보유 수량</th><th>평단가</th><th>현재가</th><th>평가 금액</th><th></th></tr></thead><tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:#929a91;padding:28px 4px">보유 코인을 추가하면 업비트 원화 시세를 불러올 수 있어요.</td></tr>`}</tbody></table></div>
					<div class="connection-note">업비트 공개 시세를 30초마다 조회합니다. 이 화면은 시세와 입력한 보유 수량으로 평가액을 계산하며, 업비트 계정 잔고를 직접 가져오지는 않습니다. 계정 연결에는 비밀키를 안전하게 보관할 서버가 필요합니다.</div>
				</section>
				<section class="panel section-wrap" style="margin-top:15px"><div class="panel-title"><h2>주식 자산</h2><span class="status-line">키움증권 연동 준비 항목</span></div><div class="connection-note">국내·해외 주식의 종목, 보유 수량, 평단가와 현재가 연동은 키움 API와 인증 서버가 준비된 뒤 연결할 수 있습니다. 현재는 업비트 공개 시세 조회를 먼저 제공하고 있어요.</div></section>`;
		}
		function showToast(message) {
			const toast = document.getElementById("toast"); toast.textContent = message; toast.classList.add("show");
			clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove("show"), 2400);
		}
		function addTransaction(form) {
			const data = new FormData(form); const title = String(data.get("title")).trim(); const amount = Math.round(Number(data.get("amount")));
			if (!title || !Number.isFinite(amount) || amount <= 0) return;
			state.transactions.push({ id: crypto.randomUUID(), title, amount, kind: entryKind, category: classify(title, entryKind), date: dateKey() });
			saveState(); render(); showToast(`${classify(title, entryKind)} 카테고리로 기록했어요.`);
		}
		async function refreshPrices() {
			if (!state.holdings.length) { showToast("먼저 코인 보유 내역을 추가해 주세요."); return; }
			const button = document.getElementById("refresh-prices"); if (button) { button.disabled = true; button.textContent = "시세 확인 중..."; }
			try {
				const markets = [...new Set(state.holdings.map(item => item.market))];
				for (let index = 0; index < markets.length; index += 50) {
					const batch = markets.slice(index, index + 50);
					const response = await fetch(`https://api.upbit.com/v1/ticker?markets=${encodeURIComponent(batch.join(","))}`);
					if (!response.ok) throw new Error("시세 조회에 실패했습니다.");
					const quotes = await response.json();
					quotes.forEach(quote => state.holdings.filter(item => item.market === quote.market).forEach(item => { item.price = quote.trade_price; }));
				}
				state.pricesUpdated = new Date().toISOString(); saveState(); render(); showToast("업비트 시세를 업데이트했어요.");
			} catch (error) { render(); showToast("시세 조회에 실패했어요. 잠시 후 다시 시도해 주세요."); }
		}
		document.addEventListener("click", event => {
			const nav = event.target.closest("[data-view]");
			if (nav) { activeView = nav.dataset.view; render(); return; }
			const goto = event.target.closest("[data-goto]");
			if (goto) { activeView = goto.dataset.goto; render(); return; }
			const kind = event.target.closest("[data-kind]");
			if (kind) { entryKind = kind.dataset.kind; document.querySelectorAll("[data-kind]").forEach(button => button.classList.toggle("active", button === kind)); return; }
			const remove = event.target.closest("[data-delete]");
			if (remove) { state.transactions = state.transactions.filter(item => item.id !== remove.dataset.delete); saveState(); render(); showToast("내역을 삭제했어요."); return; }
			const removeAsset = event.target.closest("[data-asset-delete]");
			if (removeAsset) { state.holdings = state.holdings.filter(item => item.id !== removeAsset.dataset.assetDelete); saveState(); render(); return; }
			if (event.target.closest("#refresh-prices")) refreshPrices();
		});
		document.addEventListener("submit", event => {
			if (event.target.id === "transaction-form") { event.preventDefault(); addTransaction(event.target); }
			if (event.target.id === "cash-form") { event.preventDefault(); state.cash = Math.max(0, Math.round(Number(new FormData(event.target).get("cash")) || 0)); saveState(); render(); showToast("현금·예금 금액을 저장했어요."); }
			if (event.target.id === "asset-form") {
				event.preventDefault(); const data = new FormData(event.target); const rawSymbol = String(data.get("symbol")).trim().toUpperCase().replace(/^KRW-/, "");
				const quantity = Number(data.get("quantity")); const average = Number(data.get("average"));
				if (!/^[A-Z0-9]{2,12}$/.test(rawSymbol) || quantity <= 0 || average < 0) { showToast("코인 심볼과 수량을 확인해 주세요."); return; }
				state.holdings.push({ id: crypto.randomUUID(), symbol: rawSymbol, market: `KRW-${rawSymbol}`, quantity, average, price: null }); saveState(); render(); refreshPrices();
			}
		});
		document.addEventListener("change", event => {
			if (event.target.id === "ledger-month" || event.target.id === "report-month") { selectedMonth = event.target.value || selectedMonth; render(); }
		});
		render();
		if (state.holdings.length) refreshPrices();
		setInterval(() => { if (state.holdings.length && !document.hidden) refreshPrices(); }, 30000);
	</script>
</body>
</html>
