				<form id="auth-form">
					<input class="field" name="email" type="email" placeholder="이메일" autocomplete="username" required>
					<input class="field" name="password" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password" minlength="8" required>
					<button class="primary" type="submit" data-auth-action="signin">로그인</button>
					<button class="text-button" type="button" data-auth-action="signup">계정 만들기</button>
				</form>

				<p id="sync-message" class="sync-message" role="status"></p>

		</section>
	</div>

		function mergeStateChanges(base, local, remote) {
			const merged = {};
			for (const key of new Set([...Object.keys(base), ...Object.keys(local), ...Object.keys(remote)])) {
				const before = base[key];
				const localValue = local[key];
				const remoteValue = remote[key];
				if (Array.isArray(before) && Array.isArray(localValue) && Array.isArray(remoteValue)) {
					const objectItems = [...before, ...localValue, ...remoteValue].some(item => item && typeof item === "object");
					if (!objectItems) {
						const baseSet = new Set(before);
						const localRemoved = new Set(before.filter(item => !localValue.includes(item)));
						const remoteRemoved = new Set(before.filter(item => !remoteValue.includes(item)));
						merged[key] = [...new Set([...remoteValue.filter(item => !localRemoved.has(item)), ...localValue.filter(item => !baseSet.has(item))])].filter(item => !remoteRemoved.has(item) || !baseSet.has(item));
						continue;
					}
					const byId = list => new Map(list.map(item => [item.id, item]));
					const oldItems = byId(before), localItems = byId(localValue), remoteItems = byId(remoteValue);
					const result = [];
					for (const id of new Set([...oldItems.keys(), ...localItems.keys(), ...remoteItems.keys()])) {
						const oldItem = oldItems.get(id);
						const localItem = localItems.get(id);
						const remoteItem = remoteItems.get(id);
						const localChanged = !equalState(localItem, oldItem);
						const remoteChanged = !equalState(remoteItem, oldItem);
						if (localChanged && remoteChanged && !equalState(localItem, remoteItem)) return null;
						const chosen = localChanged ? localItem : remoteItem;
						if (chosen !== undefined) result.push(chosen);
					}
					merged[key] = result;
					continue;
				}
				const localChanged = !equalState(localValue, before);
				const remoteChanged = !equalState(remoteValue, before);
				if (localChanged && remoteChanged && !equalState(localValue, remoteValue)) return null;
				merged[key] = localChanged ? localValue : remoteValue;
			}

			if (currency === "USD") return `$${Number(value).toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:4 })}`;

		function todayText() { return new Intl.DateTimeFormat("ko-KR", { year:"numeric", month:"long", day:"numeric", weekday:"short" }).format(new Date()); }
		function payCycleKey(date = new Date()) {
			const start = new Date(date.getFullYear(), date.getMonth(), date.getDate() >= 27 ? 27 : 27);
			if (date.getDate() < 27) start.setMonth(start.getMonth() - 1);
			return dateKey(start).slice(0, 7);
		}
		function payCycleBounds(cycle = selectedMonth) {
			const [year, month] = cycle.split("-").map(Number);

			const end = dateKey(new Date(year, month, 26));
			return { start, end };
		}
		function payCycleLabel(cycle = selectedMonth) {
			const { start, end } = payCycleBounds(cycle);
			return `${start.replaceAll("-", ".")} ~ ${end.replaceAll("-", ".")}`;
		}
		function monthTransactions(cycle = selectedMonth) {
			const { start, end } = payCycleBounds(cycle);
			return state.transactions.filter(item => item.date >= start && item.date <= end);
		}
		function applyFixedExpensesForCycle(cycle = payCycleKey()) {
			state.fixedExpenseCycles = Array.isArray(state.fixedExpenseCycles) ? state.fixedExpenseCycles : [];
			if (state.fixedExpenseCycles.includes(cycle)) return;
			const date = `${cycle}-27`;
			for (const [key, title, category, amount] of fixedExpenses) {
				const id = `fixed:${cycle}:${key}`;
				if (state.transactions.some(item => item.id === id)) continue;

			const currency = item.currency || "KRW";
			const averageCurrency = item.averageCurrency || "KRW";
			const fxRate = Number(state.exchangeRate) || 0;
			const currentRate = currency === "USD" ? fxRate : 1;
			const averageRate = averageCurrency === "USD" ? fxRate : 1;
			const cost = quantity * average;
			const value = current > 0 ? quantity * current : null;
			const costKrw = averageRate ? cost * averageRate : null;
			const valueKrw = currentRate && value !== null ? value * currentRate : null;
			const profitKrw = costKrw !== null && valueKrw !== null ? valueKrw - costKrw : null;
			const costInQuoteCurrency = currency === "USD" && fxRate ? costKrw / fxRate : costKrw;
			const profit = value !== null && costInQuoteCurrency !== null ? value - costInQuoteCurrency : null;
			return { quantity, average, current, currency, averageCurrency, fxRate, cost, value, profit, returnRate:costKrw > 0 && profitKrw !== null ? profitKrw / costKrw * 100 : null, costKrw, valueKrw, profitKrw };

		function exportBackup() {
			const backup = { format:"moa-household-backup", version:1, exportedAt:new Date().toISOString(), state };
			const blob = new Blob([JSON.stringify(backup, null, 2)], { type:"application/json" });
			const link = document.createElement("a");
			link.href = URL.createObjectURL(blob);
			link.download = `moa-backup-${dateKey()}.json`;
			link.click();

		async function importBackup(file) {
			if (file.size > 10 * 1024 * 1024) throw new Error("백업 파일은 10MB 이하만 복원할 수 있습니다.");
			const backup = JSON.parse(await file.text());
			if (backup?.format !== "moa-household-backup" || backup.version !== 1 || !backup.state || typeof backup.state !== "object"
				|| !Array.isArray(backup.state.accounts) || !Array.isArray(backup.state.holdings) || !Array.isArray(backup.state.transactions)) {
				throw new Error("모아에서 내보낸 올바른 백업 파일이 아닙니다.");
			}
			if (!confirm("현재 이 브라우저의 가계부 데이터를 백업 파일 내용으로 교체할까요? 현재 데이터를 먼저 백업했는지 확인해 주세요.")) return;
			if (cloudReady && cloudUser) {
				state = { ...defaultState, ...backup.state };
				saveState();
				render();
				showToast("백업 데이터를 클라우드 저장 대기열에 추가했어요.");
				return;
			}
			localStorage.setItem(STORAGE_KEY, JSON.stringify(backup.state));
			location.reload();
		}
		function addTransaction(form) {
			const data = new FormData(form); const title = String(data.get("title")).trim(); const amount = Math.round(Number(data.get("amount")));
			if (!title || !Number.isFinite(amount) || amount <= 0) return;
			state.transactions.push({ id: crypto.randomUUID(), title, amount, kind: entryKind, category: classify(title, entryKind), date: dateKey() });
			saveState(); render(); showToast(`${classify(title, entryKind)} 카테고리로 기록했어요.`);

		function updatePriceStatus() {
			const status = document.getElementById("price-status");
			if (status && activeAssetTab === "upbit") status.textContent = `${priceStreamStatus}${state.pricesUpdated ? ` · ${new Date(state.pricesUpdated).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", second:"2-digit" })}` : ""}`;
		}
		function connectPriceStream() {
			const markets = [...new Set(state.holdings.filter(item => item.type !== "stock").map(item => item.market))].sort();
			if (!markets.length) {
				if (priceSocket) priceSocket.close();
				priceStreamStatus = "코인 추가 후 연결"; updatePriceStatus(); return;
			}
			if (typeof WebSocket === "undefined") { priceStreamStatus = "웹소켓 미지원"; updatePriceStatus(); return; }
			const marketKey = markets.join(",");
			if (priceSocket && (priceSocket.readyState === WebSocket.OPEN || priceSocket.readyState === WebSocket.CONNECTING)) {
				if (priceSocket.readyState === WebSocket.OPEN && streamMarkets !== marketKey) priceSocket.close();
				else return;
			}
			priceStreamStatus = "업비트 연결 중"; updatePriceStatus();
			try {
				priceSocket = new WebSocket("wss://api.upbit.com/websocket/v1");
				streamMarkets = marketKey;
				priceSocket.addEventListener("open", () => {
					priceStreamStatus = "실시간 연결됨"; updatePriceStatus();
					priceSocket.send(JSON.stringify([{ ticket:crypto.randomUUID() }, { type:"ticker", codes:markets }]));
				});
				priceSocket.addEventListener("message", async event => {
					try {
						const payload = event.data instanceof Blob ? await event.data.text() : event.data;
						const ticker = JSON.parse(typeof payload === "string" ? payload : new TextDecoder().decode(payload));
						const affected = state.holdings.filter(item => item.type !== "stock" && item.market === ticker.code);
						if (!affected.length) return;
						affected.forEach(item => { item.price = ticker.trade_price; });
						state.pricesUpdated = new Date().toISOString();
						updateHomeAssetSummary();
						if (!priceRenderTimer) priceRenderTimer = setTimeout(() => {
							priceRenderTimer = null; saveState(5000); updatePriceStatus();
							const focused = document.activeElement;
							if (["home", "assets"].includes(activeView) && (!focused || !["INPUT", "SELECT", "BUTTON"].includes(focused.tagName))) render();
						}, 1000);
					} catch (error) { }
				});
				priceSocket.addEventListener("close", () => {
					priceSocket = null; streamMarkets = "";
					priceStreamStatus = state.holdings.some(item => item.type !== "stock") ? "재연결 대기" : "코인 추가 후 연결";
					updatePriceStatus(); clearTimeout(socketRetryTimer);
					if (state.holdings.some(item => item.type !== "stock")) socketRetryTimer = setTimeout(connectPriceStream, 3000);
				});
				priceSocket.addEventListener("error", () => priceSocket?.close());
			} catch (error) { priceSocket = null; priceStreamStatus = "연결 실패 · 재시도 중"; updatePriceStatus(); socketRetryTimer = setTimeout(connectPriceStream, 3000); }
		}
		async function refreshPrices() {
			const holdings = state.holdings.filter(item => item.type !== "stock");
			if (!holdings.length) { connectPriceStream(); return; }
			try {
				const markets = [...new Set(holdings.map(item => item.market))];
				for (let index = 0; index < markets.length; index += 50) {
					const batch = markets.slice(index, index + 50);
					const response = await fetch(`https://api.upbit.com/v1/ticker?markets=${encodeURIComponent(batch.join(","))}`);
					if (!response.ok) throw new Error("시세 조회에 실패했습니다.");
					const quotes = await response.json();
					quotes.forEach(quote => holdings.filter(item => item.market === quote.market).forEach(item => { item.price = quote.trade_price; }));
				}
				state.pricesUpdated = new Date().toISOString(); saveState(5000); updatePriceStatus(); updateHomeAssetSummary();
				if (["home", "assets"].includes(activeView)) render();
				connectPriceStream();
			} catch (error) { priceStreamStatus = "연결 확인 필요"; updatePriceStatus(); }
		}
		async function loadCoinCatalog() {
			try {
				const response = await fetch("https://api.upbit.com/v1/market/all?isDetails=false");

				coinCatalog = (await response.json()).filter(item => item.market.startsWith("KRW-")).map(item => ({ ...item, symbol:item.market.slice(4) }));

		async function searchStocks(query) {

			const response = await fetch(`/api/stock-search?market=${market}&q=${encodeURIComponent(query.trim())}`, { cache:"no-store" });

		async function refreshStockPrices() {
			const stocks = state.holdings.filter(item => item.type === "stock");
			if (!stocks.length || stockRefreshInFlight) return;
			stockRefreshInFlight = true;
			try {
				const symbols = [...new Set(stocks.map(item => item.symbol))];
				const quotes = new Map();
				for (let index = 0; index < symbols.length; index += 200) {
					const batch = symbols.slice(index, index + 200);
					const response = await fetch(`/api/quotes?symbols=${encodeURIComponent(batch.join(","))}`, { cache:"no-store" });
					const payload = await response.json();
					if (!response.ok) throw new Error(payload.error || "주식 시세 조회에 실패했습니다.");
					if (!Array.isArray(payload.result)) throw new Error("토스 시세 응답 형식이 올바르지 않습니다.");
					payload.result.forEach(quote => {
						if (quote?.symbol) quotes.set(String(quote.symbol).toLocaleUpperCase("en-US"), quote);
					});
				}
				for (const stock of stocks) {
					const quote = quotes.get(stock.symbol.toLocaleUpperCase("en-US"));
					const lastPrice = Number(quote?.lastPrice);
					if (quote && Number.isFinite(lastPrice) && lastPrice > 0) {
						stock.lastPrice = lastPrice;
						stock.price = lastPrice;
						stock.currency = quote.currency || stock.currency;
						stock.lastQuoteAt = quote.timestamp || stock.lastQuoteAt || null;
					}
				}
				let exchangeRateError = "";
				if (stocks.some(stock => stock.currency === "USD")) {
					try {
						const fxResponse = await fetch("/api/exchange-rate", { cache:"no-store" });
						const fxPayload = await fxResponse.json();
						if (!fxResponse.ok) throw new Error(fxPayload.error || `환율 조회 실패 (HTTP ${fxResponse.status}).`);
						const rate = Number(fxPayload.result?.rate);
						if (!Number.isFinite(rate) || rate <= 0) throw new Error("유효한 환율 응답이 아닙니다.");
						state.exchangeRate = rate;
						state.exchangeRateUpdated = fxPayload.result.validFrom || new Date().toISOString();
					} catch (error) { exchangeRateError = error.message; }
				}
				state.pricesUpdated = new Date().toISOString();
				stockApiStatus = `토스 시세 확인 ${new Date(state.pricesUpdated).toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", second:"2-digit" })}${exchangeRateError ? ` · 환율 갱신 실패 (${exchangeRateError}), 기존 환율 유지` : ""}`;
				saveState();
				updateHomeAssetSummary();
				if (["home", "assets"].includes(activeView)) {
					const focused = document.activeElement;
					if (!focused || !["INPUT", "SELECT", "TEXTAREA"].includes(focused.tagName)) render();
				}
			} catch (error) {
				stockApiStatus = error.message.includes("not configured") ? "토스 API 키 설정 필요 · 기존 가격 유지" : `시세 연결 실패 (${error.message}) · 마지막 가격 유지`;
				const status = document.getElementById("price-status");
				if (status && activeAssetTab !== "upbit") status.textContent = stockApiStatus;
			} finally { stockRefreshInFlight = false; }
		}
		async function checkStockApi() {
			try {
				const response = await fetch("/api/status", { cache:"no-store" });
				const result = await response.json();
				stockApiStatus = result.configured ? "토스 시세 API 연결됨" : "토스 API 키 설정 필요 · 수동 종목은 보존";
			} catch (error) { stockApiStatus = "시세 서버 연결 필요 · 수동 종목은 보존"; }
			if (state.holdings.some(item => item.type === "stock")) await refreshStockPrices();

		async function tossRequest(path) {
			if (!cloudClient || !cloudReady) throw new Error("Supabase 가계부에 로그인한 뒤 이용해 주세요.");
			const { data, error } = await cloudClient.auth.getSession();
			if (error) throw error;
			if (!data.session?.access_token) throw new Error("로그인 세션이 만료되었습니다. 다시 로그인해 주세요.");
			const response = await fetch(path, {
				headers: { Authorization:`Bearer ${data.session.access_token}` },
				cache:"no-store"
			});
			const payload = await response.json();
			if (!response.ok) throw new Error(payload.error || `요청에 실패했습니다 (HTTP ${response.status}).`);
			return payload;
		}

				stockApiStatus = `토스 계좌 조회 실패: ${error.message}`;

				showToast(stockApiStatus);
			}

		async function syncTossHoldings() {

			if (!state.tossLastSyncAt && state.holdings.length) {
				if (!confirm("첫 토스 계좌 연동 전에 현재 가계부 전체 JSON 백업을 다운로드합니다. 계속할까요?")) return;
				exportBackup();
			}

				const payload = await tossRequest(`/api/holdings?accountSeq=${encodeURIComponent(accountSeq)}`);

				if (!Array.isArray(items)) throw new Error("토스 보유 종목 응답 형식이 올바르지 않습니다.");

				const imported = items.map(item => {
					const market = item.marketCountry;
					const symbol = String(item.symbol || "").toUpperCase();
					const quantity = Number(item.quantity);
					const average = Number(item.averagePurchasePrice);
					const current = Number(item.lastPrice);
					if (!["KR", "US"].includes(market) || !/^[A-Z0-9][A-Z0-9.-]{0,19}$/.test(symbol)
						|| !Number.isFinite(quantity) || quantity <= 0 || !Number.isFinite(average) || average < 0) {
						throw new Error("토스 보유 종목 중 형식이 올바르지 않은 항목이 있어 기존 보유 정보를 변경하지 않았습니다.");
					}
					const currency = item.currency === "USD" || market === "US" ? "USD" : "KRW";
					const id = `toss:${accountSeq}:${market}:${symbol}`;
					const previous = state.holdings.find(holding => holding.id === id);
					const lastPrice = Number.isFinite(current) && current > 0 ? current : previous?.lastPrice ?? null;
					return {
						id, type:"stock", source:"account", broker:"toss", accountSeq,
						market, name:String(item.name || symbol), symbol, currency,
						averageCurrency:currency, quantity, average,
						lastPrice, price:lastPrice, lastQuoteAt:previous?.lastQuoteAt || null
					};
				});
				const existing = state.holdings.filter(holding => !(holding.type === "stock" && holding.broker === "toss" && String(holding.accountSeq) === accountSeq));
				state.holdings = [...existing, ...imported];
				state.tossLastSyncAt = updatedAt;
				state.pricesUpdated = state.pricesUpdated || null;
				saveState(); render();
				stockApiStatus = `토스 보유 종목 ${imported.length}개 연동됨`;
				showToast(`${imported.length}개 토스 보유 종목을 가계부에 반영했어요.`);
				await refreshStockPrices();
			} catch (error) {
				stockApiStatus = `토스 보유 조회 실패: ${error.message}`;
				if (activeView === "assets") render();
				showToast(stockApiStatus);
			}
		}
		async function testTossConnection() {
			stockApiStatus = "토스 인증·시세 테스트 중";
			if (activeView === "assets") render();
			try {
				const result = await tossRequest("/api/diagnostics");
				const successfulQuotes = result.quotes.filter(quote => quote.success).length;
				const quoteSummary = result.quotes.map(quote => `${quote.symbol} ${quote.success ? formatCurrency(quote.lastPrice, quote.currency || (quote.symbol === "AAPL" ? "USD" : "KRW")) : "수신 실패"}`).join(" · ");
				stockApiStatus = result.error || `OAuth ${result.oauth.success ? "성공" : "실패"} · ${quoteSummary} · 환율 ${result.exchangeRate.success ? `${won(result.exchangeRate.rate)}/USD` : "수신 실패"}`;
				if (result.oauth.success && successfulQuotes === 2 && result.exchangeRate.success) showToast("토스 OAuth, 삼성전자·애플 시세와 환율 테스트에 성공했어요.");
				else showToast(stockApiStatus);
			} catch (error) {
				stockApiStatus = `토스 연결 테스트 실패: ${error.message}`;
				showToast(stockApiStatus);
			}
			if (activeView === "assets") render();
		}
		document.addEventListener("click", event => {
			const nav = event.target.closest("[data-view]");
			if (nav) { activeView = nav.dataset.view; render(); return; }
			if (event.target.closest("[data-toss-accounts]")) { loadTossAccounts(); return; }
			if (event.target.closest("[data-toss-sync]")) { syncTossHoldings(); return; }
			if (event.target.closest("[data-toss-diagnostics]")) { testTossConnection(); return; }
			const assetTab = event.target.closest("[data-asset-tab]");
			if (assetTab) { activeAssetTab = assetTab.dataset.assetTab; stockSearchResults = []; selectedStock = null; render(); return; }
			const stockOption = event.target.closest("[data-stock-symbol]");
			if (stockOption) {
				selectedStock = { symbol:stockOption.dataset.stockSymbol, name:stockOption.dataset.stockName, market:stockOption.dataset.stockMarket, currency:stockOption.dataset.stockCurrency };
				stockSearchResults = []; render(); return;
			}
			if (event.target.closest("[data-clear-stock]")) { selectedStock = null; stockSearchResults = []; render(); return; }
			const goto = event.target.closest("[data-goto]");
			if (goto) { activeView = goto.dataset.goto; render(); return; }
			const removeAccount = event.target.closest("[data-account-delete]");
			if (removeAccount) {
				state.accounts = state.accounts.filter(account => account.id !== removeAccount.dataset.accountDelete);
				state.cash = accountTotal(); saveState(); render(); showToast("자산을 삭제했어요."); return;
			}
			const saveAccount = event.target.closest("[data-account-save]");
			if (saveAccount) {
				const row = saveAccount.closest("[data-account-row]");
				const account = state.accounts.find(item => item.id === saveAccount.dataset.accountSave);
				const label = row?.querySelector("[data-account-label]").value.trim();
				const amount = Number(row?.querySelector("[data-account-amount]").value);
				if (!account || !Number.isFinite(amount) || amount < 0) { showToast("이름과 금액을 확인해 주세요."); return; }
				account.label = label || account.category; account.amount = Math.round(amount);
				state.cash = accountTotal(); saveState(); render(); showToast("자산 정보를 저장했어요."); return;
			}
			const kind = event.target.closest("[data-kind]");
			if (kind) { entryKind = kind.dataset.kind; document.querySelectorAll("[data-kind]").forEach(button => button.classList.toggle("active", button === kind)); return; }
			const editTransaction = event.target.closest("[data-transaction-edit]");
			if (editTransaction) { editingTransactionId = editTransaction.dataset.transactionEdit; render(); return; }
			if (event.target.closest("[data-transaction-cancel]")) { editingTransactionId = null; render(); return; }
			const remove = event.target.closest("[data-delete]");
			if (remove) { state.transactions = state.transactions.filter(item => item.id !== remove.dataset.delete); saveState(); render(); showToast("내역을 삭제했어요."); return; }
			const removeAsset = event.target.closest("[data-asset-delete]");
			if (removeAsset) { state.holdings = state.holdings.filter(item => item.id !== removeAsset.dataset.assetDelete); saveState(); render(); return; }
			const editHolding = event.target.closest("[data-holding-edit]");
			if (editHolding) { editingHoldingId = editHolding.dataset.holdingEdit; render(); return; }
			if (event.target.closest("[data-holding-cancel]")) { editingHoldingId = null; render(); return; }
			const saveHolding = event.target.closest("[data-holding-save]");
			if (saveHolding) {
				const row = saveHolding.closest("[data-holding-row]");
				const holding = state.holdings.find(item => item.id === saveHolding.dataset.holdingSave);
				const name = row?.querySelector("[data-holding-name]").value.trim();
				const symbol = row?.querySelector("[data-holding-symbol]").value.trim().toUpperCase();
				const quantity = Number(row?.querySelector("[data-holding-quantity]").value);
				const average = Number(row?.querySelector("[data-holding-average]").value);
				if (!holding || !name || !/^[A-Z0-9][A-Z0-9.-]{0,19}$/.test(symbol) || !Number.isFinite(quantity) || quantity <= 0 || !Number.isFinite(average) || average <= 0) { showToast("종목명, 코드, 수량과 평단가를 확인해 주세요."); return; }
				if (holding.symbol !== symbol) { holding.lastPrice = null; holding.price = null; holding.lastQuoteAt = null; }
				holding.name = name; holding.symbol = symbol; holding.quantity = quantity; holding.average = average;
				editingHoldingId = null; saveState(); render(); showToast("보유 종목 정보를 저장했어요."); refreshStockPrices(); return;
			}
			if (event.target.closest("#export-backup")) { exportBackup(); return; }
			if (event.target.closest("#import-backup-button")) { document.getElementById("import-backup-file").click(); return; }
			if (event.target.closest("#refresh-prices")) refreshPrices();
		});
		document.addEventListener("submit", event => {
			if (event.target.id === "transaction-form") { event.preventDefault(); addTransaction(event.target); }
			if (event.target.id === "transaction-edit-form") {
				event.preventDefault();
				const form = event.target;
				const item = state.transactions.find(transaction => transaction.id === form.dataset.transactionId);
				const data = new FormData(form);
				const title = String(data.get("title") || "").trim();
				const amount = Number(data.get("amount"));
				const kind = String(data.get("kind") || "");
				const category = String(data.get("category") || "").trim();
				const date = String(data.get("date") || "");
				if (!item || !title || !Number.isSafeInteger(amount) || amount <= 0 || !["expense", "income"].includes(kind) || !category || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { showToast("내역, 금액, 종류, 분류와 날짜를 확인해 주세요."); return; }
				Object.assign(item, { title, amount, kind, category, date });
				editingTransactionId = null;
				saveState(); render(); showToast("내역을 수정했어요.");
				return;
			}
			if (event.target.id === "stock-search-form") {
				event.preventDefault();
				const query = String(new FormData(event.target).get("query") || "").trim();
				if (query) searchStocks(query).catch(() => { stockSearchResults = []; stockApiStatus = "종목 검색 실패 · API 설정을 확인하세요"; render(); });
				return;
			}
			if (event.target.id === "account-form") {
				event.preventDefault();
				const data = new FormData(event.target);
				const category = String(data.get("category") || "").trim();
				const label = String(data.get("label") || "").trim();
				const amount = Number(data.get("amount"));
				if (!category || !Number.isFinite(amount) || amount < 0) { showToast("자산 종류와 금액을 확인해 주세요."); return; }
				state.accounts.push({ id:crypto.randomUUID(), category, label:label || category, amount:Math.round(amount) });
				state.cash = accountTotal(); saveState(); render(); showToast(`${category} 자산을 추가했어요.`); return;
			}
			if (event.target.id === "cash-form") { event.preventDefault(); state.cash = Math.max(0, Math.round(Number(new FormData(event.target).get("cash")) || 0)); saveState(); render(); showToast("현금·예금 금액을 저장했어요."); }
			if (event.target.id === "asset-form") {
				event.preventDefault(); const data = new FormData(event.target); const rawSymbol = String(data.get("symbol")).trim().toUpperCase().replace(/^KRW-/, "");
				const quantity = Number(data.get("quantity")); const average = Number(data.get("average"));
				if (!/^[A-Z0-9]{2,12}$/.test(rawSymbol) || quantity <= 0 || average < 0) { showToast("코인 심볼과 수량을 확인해 주세요."); return; }
				state.holdings.push({ id: crypto.randomUUID(), symbol: rawSymbol, market: `KRW-${rawSymbol}`, quantity, average, price: null }); saveState(); render(); refreshPrices();
			}
			if (event.target.id === "stock-asset-form") {
				event.preventDefault();
				const data = new FormData(event.target);
				const name = selectedStock?.name || "";
				const quantity = Number(data.get("quantity"));
				const average = Number(data.get("average"));
				if (!selectedStock || quantity <= 0 || average <= 0 || ![quantity, average].every(Number.isFinite)) { showToast("종목, 수량과 평단가를 확인해 주세요."); return; }
				state.holdings.push({ id:crypto.randomUUID(), type:"stock", source:"manual", market:selectedStock.market, broker:"kiwoom", name, symbol:selectedStock.symbol, currency:selectedStock.currency, averageCurrency:selectedStock.currency, quantity, average, lastPrice:null, price:null, lastQuoteAt:null });
				saveState(); selectedStock = null; render(); showToast(`${name} 종목을 저장했어요.`); refreshStockPrices();
			}
			if (event.target.id === "stock-manual-form") {
				event.preventDefault();
				const data = new FormData(event.target);
				const name = String(data.get("name") || "").trim();
				const symbol = String(data.get("symbol") || "").trim().toUpperCase();
				const quantity = Number(data.get("quantity"));
				const average = Number(data.get("average"));
				if (!name || !/^[A-Z0-9][A-Z0-9.-]{0,19}$/.test(symbol) || !Number.isFinite(quantity) || quantity <= 0 || !Number.isFinite(average) || average <= 0) { showToast("종목명, 코드, 수량과 평단가를 확인해 주세요."); return; }
				if (activeAssetTab === "toss" || activeAssetTab === "toss-us") { showToast("토스 계좌 조회 연동은 아직 설정되지 않았습니다."); return; }
				const market = activeAssetTab === "us" || activeAssetTab === "toss-us" ? "US" : "KR";
				const currency = market === "US" ? "USD" : "KRW";
				state.holdings.push({ id:crypto.randomUUID(), type:"stock", source:"manual", broker:"kiwoom", market, name, symbol, currency, averageCurrency:currency, quantity, average, lastPrice:null, price:null, lastQuoteAt:null });
				saveState(); render(); showToast(`${name} 종목을 직접 등록했어요.`); refreshStockPrices();
			}
		});
		document.addEventListener("change", event => {
			if (event.target.id === "toss-account-select") {
				state.tossAccountSeq = event.target.value || null;
				saveState();
				const syncButton = document.querySelector("[data-toss-sync]");
				if (syncButton) syncButton.disabled = !state.tossAccountSeq;
				return;
			}
			if (event.target.id !== "import-backup-file") return;
			const [file] = event.target.files || [];
			if (file) importBackup(file).catch(error => { console.error("가계부 백업 복원 실패:", error); showToast(`백업을 복원하지 못했습니다. ${error.message}`); });
			event.target.value = "";
		});
		document.addEventListener("input", event => {
			if (event.target.id !== "stock-search-query") return;
			clearTimeout(stockSearchTimer);
			stockSearchTimer = setTimeout(() => {
				const query = event.target.value.trim();
				if (query.length >= 2) searchStocks(query).catch(() => { stockSearchResults = []; stockApiStatus = "종목 검색 실패 · API 설정을 확인하세요"; });
			}, 350);
		});
		document.addEventListener("change", event => {
			if (event.target.id === "ledger-month" || event.target.id === "report-month") { selectedMonth = event.target.value || selectedMonth; render(); }
		});
		document.getElementById("auth-form").addEventListener("submit", async event => {
			event.preventDefault();
			if (!cloudClient) { setSyncMessage("Supabase 연결 설정이 완료되지 않았습니다."); return; }
			const form = new FormData(event.currentTarget);
			const email = String(form.get("email") || "").trim();
			const password = String(form.get("password") || "");
			const action = event.submitter?.dataset.authAction || "signin";
			setSyncMessage(action === "signup" ? "계정을 만들고 있습니다..." : "로그인 중입니다...");
			try {
				const result = action === "signup"
					? await cloudClient.auth.signUp({ email, password, options:{ emailRedirectTo:location.origin } })
					: await cloudClient.auth.signInWithPassword({ email, password });
				if (result.error) throw result.error;
				if (result.data.session?.user) await handleAuthenticatedUser(result.data.session.user);
				else setSyncMessage("인증 이메일을 확인한 뒤 이 페이지로 돌아와 로그인해 주세요.");
			} catch (error) {
				console.error("Supabase 인증 실패:", error);
				setSyncMessage(`로그인/계정 생성에 실패했습니다: ${error.message}`);
			}
		});
		document.getElementById("sign-out").addEventListener("click", async () => {
			const { error } = await cloudClient.auth.signOut();
			if (error) { setSyncStatus("로그아웃 실패", "error"); setSyncMessage(error.message); }
		});
		document.getElementById("sign-out-gate").addEventListener("click", async () => {
			const { error } = await cloudClient.auth.signOut();
			if (error) setSyncMessage(`로그아웃에 실패했습니다: ${error.message}`);
		});
		document.getElementById("migrate-local").addEventListener("click", async event => {
			event.currentTarget.disabled = true;
			setSyncMessage("기존 기록을 백업하고 Supabase에 한 번만 이전합니다...");
			try { await saveLegacyDataToCloud(); }
			catch (error) {
				console.error("기존 가계부 이전 실패:", error);
				setSyncMessage(`이전하지 못했습니다: ${error.message}. 기존 기록과 다운로드한 백업은 그대로 보존됩니다.`);
			} finally { event.currentTarget.disabled = false; }
		});
		render();
		initializeCloudSync();
		if ("serviceWorker" in navigator) navigator.serviceWorker.register("/service-worker.js").catch(error => console.error("PWA 서비스 워커 등록 실패:", error));
	</script>
</body>
</html>
